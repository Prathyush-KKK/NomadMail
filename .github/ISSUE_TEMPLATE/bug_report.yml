name: Bug report
description: Report a reproducible NomadInbox bug.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not paste OAuth tokens, token caches, private message bodies, mailbox exports, or screenshots containing private data.
  - type: input
    id: version
    attributes:
      label: NomadInbox version
      description: Value from VERSION or release tag.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - MCP
        - HTTP service
        - Windows tray
        - Installer
        - Gmail API
        - Outlook Desktop
        - Outlook Graph
        - Archive import
        - Backup/restore
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: input
    id: powershell
    attributes:
      label: PowerShell version
      placeholder: "5.1 or 7.x"
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "node --version"
  - type: textarea
    id: command
    attributes:
      label: Command or action
      description: Paste the exact command or UI action.
      render: powershell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or output
      description: Redact private mailbox data, tokens, account IDs, and secrets.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed tokens, credentials, private message bodies, and mailbox exports from this report.
          required: true

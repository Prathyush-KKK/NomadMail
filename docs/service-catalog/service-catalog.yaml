services:
  - name: nomadinbox-cli
    type: local-cli
    status: bootstrapped
    criticality: high
    interfaces:
      - powershell
      - json-output
  - name: nomadmail-mcp-server
    type: local-agent-service
    status: bootstrapped
    criticality: high
    interfaces:
      - mcp-stdio
      - node
      - powershell-launcher
      - service/nomadmail-service.mjs
    responsibilities:
      - expose-agent-tools
      - wrap-nomadinbox-cli
      - expose-startup-system-prompt
      - expose-workspace-state
      - search-local-message-store
      - sync-before-latest-email-read
      - expose-locale-time-context
      - return-platform-runtime-guidance
      - preserve-send-confirmation-boundary
  - name: nomadmail-http-service
    type: local-http-service
    status: bootstrapped
    criticality: high
    interfaces:
      - http-127.0.0.1
      - openapi
      - service/nomadmail-service.mjs
    responsibilities:
      - expose-local-rest-api
      - support-non-mcp-agents
      - expose-startup-system-prompt
      - expose-workspace-state
      - expose-locale-time-context
      - sync-before-latest-email-read
      - wrap-nomadinbox-cli
      - return-platform-runtime-guidance
  - name: locale-time-context
    type: local-core-support
    status: bootstrapped
    criticality: high
    interfaces:
      - NOMADINBOX_USER_CULTURE
      - NOMADINBOX_USER_LOCALE
      - NOMADINBOX_USER_TIME_ZONE
      - NOMADINBOX_USER_TIME_ZONE_IANA
      - os-user-locale
    responsibilities:
      - parse-ambiguous-user-times
      - normalize-persisted-timestamps-to-utc-iso
      - expose-local-time-context-to-agents
      - format-user-facing-status-times
  - name: windows-agent-helper
    type: local-installer
    status: bootstrapped
    criticality: medium
    interfaces:
      - scripts/install-windows-agent-helper.ps1
      - scripts/nomad-inbox.ps1 install windows-helper
      - nomadmail_install_windows_helper
    responsibilities:
      - initialize-ignored-runtime-state
      - initialize-local-account-config
      - install-helper-launcher
      - publish-helper-status
    notes:
      - Windows-only.
      - Does not connect accounts, read mailbox data, or start auto sync by default.
  - name: nomadinbox-core
    type: local-core
    status: bootstrapped
    criticality: high
    responsibilities:
      - provider-registry
      - safety-gate
      - schema-contracts
  - name: background-sync-worker
    type: local-user-session-worker
    status: bootstrapped
    criticality: medium
    interfaces:
      - powershell
      - config/accounts.json
      - data/sync-status.json
    responsibilities:
      - optional-periodic-sync
      - per-account-scheduling
      - status-publication
    notes:
      - Disabled by default.
      - Runs in the signed-in user session so desktop providers can work.
      - Not a privileged Windows Service in the bootstrap version.
  - name: compiled-system-tray-client
    type: local-user-interface
    status: bootstrapped
    criticality: medium
    interfaces:
      - target/NomadInboxTray/NomadInboxTray.exe
      - src/NomadInbox.Tray/NomadInboxTray.cs
      - windows-forms-notifyicon
      - cached-status-file
      - local-http-async
    responsibilities:
      - keep-local-http-service-available
      - render-menu-from-cached-state
      - queue-sync-now-as-background-task
      - start-stop-background-sync-as-background-task
      - show-sync-status-and-settings
    notes:
      - PowerShell remains the launcher/build wrapper and service layer.
      - Menu construction must not call HTTP, sync, or CLI directly.
  - name: archive-importer
    type: local-importer
    status: bootstrapped
    criticality: medium
    interfaces:
      - powershell
      - data/archive-messages.jsonl
      - data/archive-index.jsonl
      - data/import-status.json
    responsibilities:
      - parse-eml
      - parse-mbox
      - parse-message-jsonl
      - preserve-provenance
      - mark-imported-messages-read-only
    notes:
      - Imported archive mail is context only.
      - PST and MSG import are planned, not bootstrapped.
  - name: backup-status-prompter
    type: local-status
    status: bootstrapped
    criticality: medium
    interfaces:
      - powershell
      - data/messages.jsonl
      - data/archive-messages.jsonl
    responsibilities:
      - report-live-sync-counts
      - report-archive-import-counts
      - guide-users-to-sync-or-import
  - name: gmail-api-provider
    type: provider-adapter
    status: bootstrapped-sync
    auth:
      - google-oauth
      - workspace-domain-delegation
      - bearer-token-env
      - gcloud-access-token
  - name: outlook-graph-provider
    type: provider-adapter
    status: bootstrapped-sync
    auth:
      - microsoft-graph-oauth
      - bearer-token-env
      - azure-cli-access-token
  - name: outlook-desktop-provider
    type: provider-adapter
    status: bootstrapped-sync
    auth:
      - local-outlook-profile

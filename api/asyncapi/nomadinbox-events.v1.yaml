asyncapi: 2.6.0
info:
  title: NomadInbox Local Events
  version: 0.1.0
  description: JSONL event contracts for local message sync and action audit records.
channels:
  data/messages.jsonl:
    subscribe:
      summary: Message records written after sync
  data/actions.jsonl:
    subscribe:
      summary: Audit records for mutating actions
  data/sync-status.json:
    subscribe:
      summary: Latest background sync worker state and per-account sync results
      message:
        name: SyncStatus
        payload:
          type: object
          properties:
            service:
              type: string
            worker:
              type: string
            lastRunAt:
              type: string
              format: date-time
            nextRunAt:
              type: string
              format: date-time
            accounts:
              type: array
              items:
                type: object
                properties:
                  accountId:
                    type: string
                  provider:
                    type: string
                  status:
                    type: string
                  synced:
                    type: integer
            updatedAt:
              type: string
              format: date-time
  data/archive-messages.jsonl:
    subscribe:
      summary: Read-only normalized messages imported from mail exports
  data/archive-index.jsonl:
    subscribe:
      summary: Disposable searchable projection for imported archive mail
  data/import-status.json:
    subscribe:
      summary: Latest archive import status and warning counts
      message:
        name: ImportStatus
        payload:
          type: object
          properties:
            service:
              type: string
            status:
              type: string
            lastImportAt:
              type: string
              format: date-time
            lastBatchId:
              type: string
            lastSource:
              type: string
            lastFormat:
              type: string
            importedMessages:
              type: integer
            skippedMessages:
              type: integer
            warnings:
              type: array
              items:
                type: string

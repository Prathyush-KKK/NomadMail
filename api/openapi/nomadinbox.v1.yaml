openapi: 3.0.3
info:
  title: NomadMail Local API
  version: 0.1.0
  description: Local HTTP wrapper over NomadInbox provider operations for non-MCP agents.
servers:
  - url: http://127.0.0.1:8791
    description: Local-only API
paths:
  /agent-guide:
    get:
      operationId: nomadmailGetAgentGuide
      summary: Show guidance for agents that parse email backups and sync target repository indexes
      responses:
        "200":
          description: Agent guidance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentGuide"
  /startup-system-prompt:
    get:
      operationId: nomadmailGetStartupSystemPrompt
      summary: Return the canonical NomadInbox/NomadMail startup system prompt
      description: Agents should load this prompt automatically when opening NomadInbox as a workspace. It is owned by the system, not by the user.
      responses:
        "200":
          description: Startup system prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemPrompt"
  /workspace-state:
    get:
      operationId: nomadmailGetWorkspaceState
      summary: Return the living NomadInbox workspace state
      description: Agents should read this state before answering, then refresh live status through health/provider/account tools.
      responses:
        "200":
          description: Workspace state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceState"
  /agent-user-flow:
    get:
      operationId: nomadmailGetAgentUserFlow
      summary: Return the definitive user-facing agent flow
      description: Agents should use this flow when explaining first-run setup, sync/import approvals, service/tray setup, daily mail query choices, and mail action follow-up.
      responses:
        "200":
          description: Agent user flow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentUserFlow"
  /cross-chat-handoff:
    get:
      operationId: nomadmailGetCrossChatHandoff
      summary: Return the canonical cross-chat handoff prompt
      description: Agents should use this when a different chat session needs to connect to the same local NomadInbox/NomadMail workspace through MCP, local HTTP, or repo scripts.
      responses:
        "200":
          description: Cross-chat handoff prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrossChatHandoff"
  /agent-events:
    get:
      operationId: nomadmailListAgentEvents
      summary: List local assigned-agent automation events
      description: Returns bounded local events for an assigned agent such as Codex. Events are review prompts and do not authorize mailbox mutation.
      parameters:
        - name: assignedAgent
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, acknowledged, all]
            default: pending
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        "200":
          description: Agent event list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentEventList"
  /agent-events/automation-cycle:
    post:
      operationId: nomadmailRunAgentAutomationCycle
      summary: Queue local review events for an assigned agent
      description: Creates pending local events from live synced messages, optionally after a one-shot sync against already enabled accounts. This never sends, deletes, moves, archives, marks, or saves attachments.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                assignedAgent:
                  type: string
                  default: codex
                accountId:
                  type: string
                syncFirst:
                  type: boolean
                  default: false
                limit:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 10
                onlyUnread:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Automation cycle result
  /agent-events/ack:
    post:
      operationId: nomadmailAckAgentEvent
      summary: Acknowledge one local assigned-agent event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId]
              properties:
                eventId:
                  type: string
                acknowledgedBy:
                  type: string
                  default: agent
      responses:
        "200":
          description: Acknowledgement result
  /agent-events/{eventId}/ack:
    post:
      operationId: nomadmailAckAgentEventById
      summary: Acknowledge one local assigned-agent event by path id
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                acknowledgedBy:
                  type: string
                  default: agent
      responses:
        "200":
          description: Acknowledgement result
  /health:
    get:
      operationId: nomadmailHealthCheck
      summary: Check local service health
      responses:
        "200":
          description: Healthy
  /install/windows-helper:
    post:
      operationId: nomadmailInstallWindowsHelper
      summary: Install the Windows PowerShell helper for sync and account tracking
      description: Returns unsupportedPlatform on non-Windows hosts. The helper initializes ignored local runtime state but does not connect accounts, read mailbox data, or start auto sync unless requested.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dataDir:
                  type: string
                installRoot:
                  type: string
                startTray:
                  type: boolean
                  default: false
                registerStartup:
                  type: boolean
                  default: false
                  description: Register the compiled tray app in the current user's Windows Startup folder.
                showPopup:
                  type: boolean
                  default: false
                  description: Open the tray status popup when the tray starts now and on future startup launches.
                skipUserEnvironment:
                  type: boolean
                  default: false
                  description: Skip user environment variable registration for tests and temporary installs.
      responses:
        "200":
          description: Install result or unsupported-platform response
  /providers:
    get:
      operationId: nomadmailListProviders
      summary: List provider configuration and capabilities
      responses:
        "200":
          description: Provider list
  /accounts:
    get:
      operationId: nomadmailListAccounts
      summary: List configured accounts and background sync settings
      responses:
        "200":
          description: Account list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  defaultIntervalSeconds:
                    type: integer
                  accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Account"
  /messages/sync:
    post:
      operationId: nomadmailSyncMessages
      summary: Sync provider messages into local store
      responses:
        "200":
          description: Sync result
  /messages/latest:
    post:
      operationId: nomadmailGetLatestMessage
      summary: Sync first, then return the newest live message with available content
      description: Use for latest-email questions. The one-shot sync only covers already configured and enabled live accounts; if sync cannot complete, clients must not present stale local data as definitely latest.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId:
                  type: string
                provider:
                  type: string
                folder:
                  type: string
                requireContent:
                  type: boolean
                  default: true
                syncFirst:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Latest live message result
  /messages/open:
    post:
      operationId: nomadmailOpenMessage
      summary: Open a synced Outlook Desktop message in the local Outlook client
      description: Resolves a selected NomadMail message id or Outlook conversation id to the preserved Outlook EntryID and opens it through Outlook Desktop COM.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                conversationId:
                  type: string
                latestInThread:
                  type: boolean
                  default: true
                dryRun:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Open result, dry-run target, or unsupported-runtime response
  /messages/action:
    post:
      operationId: nomadmailExecuteMessageAction
      summary: Execute an approved Outlook Desktop message action
      description: Draft actions save drafts only. Send requires confirmSend. Mark, flag, move, archive, and save attachment require confirmAction. Trash/delete requires confirmDelete and confirmFinal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageActionExecuteRequest"
      responses:
        "200":
          description: Action result, dry-run result, or pending-confirmation response
  /sync/once:
    post:
      operationId: nomadmailSyncOnce
      summary: Run one sync cycle for enabled accounts
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId:
                  type: string
      responses:
        "200":
          description: Sync cycle result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
  /backup/status:
    get:
      operationId: nomadmailGetBackupStatus
      summary: Show live sync and archive import backup depth with user prompts
      responses:
        "200":
          description: Backup/context status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupStatus"
  /import/status:
    get:
      operationId: nomadmailGetImportStatus
      summary: Show latest archive import status
      responses:
        "200":
          description: Latest import status
  /import/{format}:
    post:
      operationId: nomadmailImportArchive
      summary: Import read-only mail export context
      parameters:
        - name: format
          in: path
          required: true
          schema:
            type: string
            enum: [eml, mbox, jsonl]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                source:
                  type: string
                maxMessages:
                  type: integer
                includeBodies:
                  type: boolean
                dryRun:
                  type: boolean
      responses:
        "200":
          description: Import result
  /service/status:
    get:
      operationId: nomadmailGetServiceStatus
      summary: Show optional background sync worker status
      responses:
        "200":
          description: Worker status and latest sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStatus"
  /service/start:
    post:
      operationId: nomadmailStartService
      summary: Start optional user-session background sync
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                intervalSeconds:
                  type: integer
                  minimum: 30
      responses:
        "200":
          description: Worker started or already running
  /service/stop:
    post:
      operationId: nomadmailStopService
      summary: Stop optional user-session background sync
      responses:
        "200":
          description: Worker stopped or already stopped
  /messages:
    get:
      operationId: nomadmailSearchMessages
      summary: Search local messages
      parameters:
        - name: query
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 10, minimum: 1, maximum: 100 }
        - name: includeLive
          in: query
          schema: { type: boolean, default: true }
        - name: includeArchive
          in: query
          schema: { type: boolean, default: true }
        - name: provider
          in: query
          schema: { type: string }
        - name: folder
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Message results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageSearchResult"
  /messages/{id}:
    get:
      operationId: nomadmailGetMessage
      summary: Get one locally stored message
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Message lookup result
  /messages/{id}/actions:
    get:
      operationId: nomadmailGetMessageActions
      summary: Get permission-gated action guidance for one discovered message
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Message action guide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageActionGuideResult"
  /messages/{id}/open:
    post:
      operationId: nomadmailOpenMessageById
      summary: Open one synced Outlook Desktop message by NomadMail id
      description: Navigation-only action. Uses the preserved Outlook EntryID and does not mutate mail.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dryRun:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Open result or dry-run target
  /messages/{id}/action:
    post:
      operationId: nomadmailExecuteMessageActionById
      summary: Execute an approved Outlook Desktop action for one message
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageActionExecuteRequest"
      responses:
        "200":
          description: Action result, dry-run result, or pending-confirmation response
  /message-actions:
    get:
      operationId: nomadmailGetGeneralMessageActions
      summary: Get general mail action guidance without a selected message
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: General or message-specific action guide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageActionGuideResult"
components:
  schemas:
    AgentGuide:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        purpose:
          type: string
        timeHandling:
          type: object
          properties:
            locale:
              type: string
            timeZone:
              type: string
            nowUtc:
              type: string
            nowLocal:
              type: string
            parsingRule:
              type: string
        startupSystemPrompt:
          $ref: "#/components/schemas/SystemPrompt"
        workspaceState:
          $ref: "#/components/schemas/WorkspaceState"
        agentUserFlow:
          $ref: "#/components/schemas/AgentUserFlow"
        crossChatHandoff:
          $ref: "#/components/schemas/CrossChatHandoff"
        agentAutomation:
          type: object
          properties:
            rule:
              type: string
            eventStore:
              type: string
            codexPattern:
              type: string
            eventTools:
              type: array
              items:
                type: string
            privacyBoundary:
              type: string
        storageBoundary:
          type: object
          properties:
            defaultDataDir:
              type: string
            activeDataDir:
              type: string
            rule:
              type: string
            targetRepoRule:
              type: string
        safeWorkflow:
          type: array
          items:
            type: string
        importFormats:
          type: object
        liveSyncGuidance:
          type: array
          items:
            type: string
        targetIndexExamples:
          type: array
          items:
            type: object
        safetyRules:
          type: array
          items:
            type: string
        mailActionGuidance:
          $ref: "#/components/schemas/MessageActionGuide"
    SystemPrompt:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        name:
          type: string
        promptType:
          type: string
          enum: [system]
        path:
          type: string
        text:
          type: string
    WorkspaceState:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        name:
          type: string
        path:
          type: string
        text:
          type: string
    AgentUserFlow:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        name:
          type: string
        path:
          type: string
        text:
          type: string
    CrossChatHandoff:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        name:
          type: string
        path:
          type: string
        text:
          type: string
    AgentEventList:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        assignedAgent:
          type: string
          nullable: true
        eventStatus:
          type: string
        count:
          type: integer
        events:
          type: array
          items:
            $ref: "#/components/schemas/AgentEvent"
        eventsPath:
          type: string
        usage:
          type: string
    AgentEvent:
      type: object
      required: [schemaVersion, eventId, status, eventType, assignedAgent, createdAt, summary]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        eventId:
          type: string
        status:
          type: string
          enum: [pending, acknowledged]
        eventType:
          type: string
        priority:
          type: string
          enum: [low, normal, high]
        assignedAgent:
          type: string
        createdAt:
          type: string
        createdAtLocal:
          type: string
          nullable: true
        updatedAt:
          type: string
        acknowledgedAt:
          type: string
          nullable: true
        acknowledgedBy:
          type: string
          nullable: true
        source:
          type: string
        accountId:
          type: string
          nullable: true
        provider:
          type: string
          nullable: true
        summary:
          type: string
        messageRefs:
          type: array
          items:
            $ref: "#/components/schemas/MessageSummary"
        actionHint:
          type: string
        dedupeKey:
          type: string
          nullable: true
        metadata:
          type: object
    Account:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        provider:
          type: string
          enum: [gmail-api, outlook-graph, outlook-desktop, sample]
        enabled:
          type: boolean
        folder:
          type: string
        queryConfigured:
          type: boolean
        limit:
          type: integer
        intervalSeconds:
          type: integer
    SyncResult:
      type: object
      properties:
        status:
          type: string
        accountCount:
          type: integer
        results:
          type: array
          items:
            type: object
            properties:
              accountId:
                type: string
              provider:
                type: string
              status:
                type: string
              synced:
                type: integer
              reason:
                type: string
                nullable: true
    ServiceStatus:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        worker:
          type: string
          enum: [running, stopped]
        pid:
          type: integer
          nullable: true
        pidPath:
          type: string
        statusPath:
          type: string
        logPath:
          type: string
        syncStatus:
          type: object
          nullable: true
        timeContext:
          type: object
          nullable: true
    BackupStatus:
      type: object
      properties:
        status:
          type: string
        liveSyncedMessages:
          type: integer
        archiveImportedMessages:
          type: integer
        archiveIndexedMessages:
          type: integer
        totalBackedUpMessages:
          type: integer
        userPrompts:
          type: array
          items:
            type: string
    MessageSummary:
      type: object
      properties:
        id:
          type: string
        provider:
          type: string
        sourceType:
          type: string
        providerMessageId:
          type: string
          nullable: true
        conversationId:
          type: string
          nullable: true
        folder:
          type: string
          nullable: true
        subject:
          type: string
        from:
          type: object
          nullable: true
        to:
          type: array
          items:
            type: object
        receivedAt:
          type: string
          nullable: true
        receivedAtLocal:
          type: string
          nullable: true
        snippet:
          type: string
          nullable: true
        unread:
          type: boolean
        flagged:
          type: boolean
        actionable:
          type: boolean
        capabilities:
          type: array
          items:
            type: string
        actionMenu:
          type: object
          description: Compact action choices and permission notes for this message.
    MessageActionGuideResult:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        message:
          $ref: "#/components/schemas/MessageSummary"
        actionGuide:
          $ref: "#/components/schemas/MessageActionGuide"
    MessageActionExecuteRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum:
            - draft-reply
            - draft-reply-all
            - draft-forward
            - draft-new
            - send-draft
            - mark-read
            - mark-unread
            - flag
            - unflag
            - move
            - archive
            - save-attachment
            - trash
            - delete
        id:
          type: string
        conversationId:
          type: string
        latestInThread:
          type: boolean
          default: true
        to:
          type: string
        cc:
          type: string
        bcc:
          type: string
        subject:
          type: string
        body:
          type: string
        targetFolder:
          type: string
        attachmentId:
          type: string
        outputDir:
          type: string
        draftEntryId:
          type: string
        openDraft:
          type: boolean
          default: false
        confirmAction:
          type: boolean
          default: false
        confirmSend:
          type: boolean
          default: false
        confirmDelete:
          type: boolean
          default: false
        confirmFinal:
          type: string
        dryRun:
          type: boolean
          default: false
      additionalProperties: false
    MessageActionGuide:
      type: object
      properties:
        actionable:
          type: boolean
        provider:
          type: string
          nullable: true
        sourceType:
          type: string
          nullable: true
        capabilities:
          type: array
          items:
            type: string
        userPrompt:
          type: string
        primaryActions:
          type: array
          items:
            type: object
        secondaryActions:
          type: array
          items:
            type: object
        permissionModel:
          type: object
        liveActionPreconditions:
          type: array
          items:
            type: string
        providerCaveat:
          type: string
        implementationNote:
          type: string
    MessageSearchResult:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        query:
          type: string
        limit:
          type: integer
        includeLive:
          type: boolean
        includeArchive:
          type: boolean
        count:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/MessageSummary"

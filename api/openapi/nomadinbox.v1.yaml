openapi: 3.0.3
info:
  title: NomadInbox Local API
  version: 0.1.0
  description: Future local HTTP wrapper over NomadInbox provider operations.
servers:
  - url: http://127.0.0.1:8791
    description: Local-only API
paths:
  /health:
    get:
      summary: Check local service health
      responses:
        "200":
          description: Healthy
  /providers:
    get:
      summary: List provider configuration and capabilities
      responses:
        "200":
          description: Provider list
  /accounts:
    get:
      summary: List configured accounts and background sync settings
      responses:
        "200":
          description: Account list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  defaultIntervalSeconds:
                    type: integer
                  accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Account"
  /messages/sync:
    post:
      summary: Sync provider messages into local store
      responses:
        "200":
          description: Sync result
  /sync/once:
    post:
      summary: Run one sync cycle for enabled accounts
      responses:
        "200":
          description: Sync cycle result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
  /backup/status:
    get:
      summary: Show live sync and archive import backup depth with user prompts
      responses:
        "200":
          description: Backup/context status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupStatus"
  /import/status:
    get:
      summary: Show latest archive import status
      responses:
        "200":
          description: Latest import status
  /import/{format}:
    post:
      summary: Import read-only mail export context
      parameters:
        - name: format
          in: path
          required: true
          schema:
            type: string
            enum: [eml, mbox, jsonl]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                source:
                  type: string
                maxMessages:
                  type: integer
                includeBodies:
                  type: boolean
                dryRun:
                  type: boolean
      responses:
        "200":
          description: Import result
  /service/status:
    get:
      summary: Show optional background sync worker status
      responses:
        "200":
          description: Worker status and latest sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStatus"
  /service/start:
    post:
      summary: Start optional user-session background sync
      responses:
        "200":
          description: Worker started or already running
  /service/stop:
    post:
      summary: Stop optional user-session background sync
      responses:
        "200":
          description: Worker stopped or already stopped
  /messages:
    get:
      summary: Search local messages
      parameters:
        - name: query
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: Message results
components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        provider:
          type: string
          enum: [gmail-api, outlook-graph, outlook-desktop, sample]
        enabled:
          type: boolean
        folder:
          type: string
        queryConfigured:
          type: boolean
        limit:
          type: integer
        intervalSeconds:
          type: integer
    SyncResult:
      type: object
      properties:
        status:
          type: string
        accountCount:
          type: integer
        results:
          type: array
          items:
            type: object
            properties:
              accountId:
                type: string
              provider:
                type: string
              status:
                type: string
              synced:
                type: integer
              reason:
                type: string
                nullable: true
    ServiceStatus:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        worker:
          type: string
          enum: [running, stopped]
        pid:
          type: integer
          nullable: true
        pidPath:
          type: string
        statusPath:
          type: string
        logPath:
          type: string
        syncStatus:
          type: object
          nullable: true
    BackupStatus:
      type: object
      properties:
        status:
          type: string
        liveSyncedMessages:
          type: integer
        archiveImportedMessages:
          type: integer
        archiveIndexedMessages:
          type: integer
        totalBackedUpMessages:
          type: integer
        userPrompts:
          type: array
          items:
            type: string
